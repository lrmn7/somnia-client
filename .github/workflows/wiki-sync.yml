name: Sync Docs to Wiki

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"
      - ".github/workflows/wiki-sync.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Repository
        uses: actions/checkout@v4

      - name: Sync Documentation to Wiki
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          echo "Cloning Wiki from current repository..."
          if ! git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git" wiki; then
            echo "::error::GitHub Wiki is not initialized! Please open https://github.com/${{ github.repository }}/wiki and click 'Create the first page' once to initialize the wiki repository."
            exit 1
          fi

          echo "Copying documentation pages to Wiki..."
          cp docs/*.md wiki/

          # Setup Home page from README
          cp README.md wiki/Home.md
          sed -i 's|\./docs/||g' wiki/Home.md
          sed -i 's|\.md)|)|g' wiki/Home.md
          sed -i 's|\./LICENSE|https://github.com/${{ github.repository }}/blob/main/LICENSE|g' wiki/Home.md
          sed -i 's|\./\.env\.example|https://github.com/${{ github.repository }}/blob/main/.env.example|g' wiki/Home.md

          echo "Generating Wiki Sidebar..."
          printf '### [somnia-client](Home)\n\n' > wiki/_Sidebar.md
          printf '**Documentation**\n' >> wiki/_Sidebar.md
          printf '* [Home](Home)\n' >> wiki/_Sidebar.md
          printf '* [Quick Start](getting-started)\n' >> wiki/_Sidebar.md
          printf '* [Architecture](architecture)\n' >> wiki/_Sidebar.md
          printf '* [Configuration](configuration)\n' >> wiki/_Sidebar.md
          printf '* [Network & Chains](network)\n' >> wiki/_Sidebar.md
          printf '* [Security Best Practices](security)\n' >> wiki/_Sidebar.md
          printf '* [Compatibility Matrix](compatibility)\n' >> wiki/_Sidebar.md
          printf '* [Limitations & Boundaries](limitations)\n' >> wiki/_Sidebar.md
          printf '* [Feature Support Matrix](feature-support)\n\n' >> wiki/_Sidebar.md
          printf '---\n' >> wiki/_Sidebar.md
          printf '**Links**\n' >> wiki/_Sidebar.md
          printf '* [GitHub Repository](https://github.com/${{ github.repository }})\n' >> wiki/_Sidebar.md
          printf '* [Issue Tracker](https://github.com/${{ github.repository }}/issues)\n' >> wiki/_Sidebar.md
          printf '* [npm Package](https://www.npmjs.com/package/somnia-client)\n' >> wiki/_Sidebar.md

          echo "Generating Wiki Footer..."
          printf '---\n' > wiki/_Footer.md
          printf '*somnia-client — Discord-first client and abstraction layer for Somnia blockchain development.*\n' >> wiki/_Footer.md
          printf '[GitHub Repository](https://github.com/${{ github.repository }}) · [MIT License](https://github.com/${{ github.repository }}/blob/main/LICENSE)\n' >> wiki/_Footer.md

          cd wiki
          git add -A
          if git diff --staged --quiet; then
            echo "No changes detected. Wiki is already up-to-date."
          else
            git commit -m "docs: auto-sync documentation from docs/ folder"
            git push origin HEAD
            echo "Wiki successfully synchronized!"
          fi
