name: Sync Docs to Wiki

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"
      - ".github/workflows/wiki-sync.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Repository
        uses: actions/checkout@v4

      - name: Sync Documentation to Wiki
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          echo "Cloning Wiki from current repository..."
          if ! git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git" wiki; then
            echo "::error::GitHub Wiki is not initialized! Please open https://github.com/${{ github.repository }}/wiki and click 'Create the first page' once to initialize the wiki repository."
            exit 1
          fi

          echo "Copying documentation pages to Wiki..."
          cp docs/*.md wiki/

          # Setup Home page from README
          cp README.md wiki/Home.md
          sed -i 's|\./docs/||g' wiki/Home.md
          sed -i 's|\.md)|)|g' wiki/Home.md
          sed -i 's|\./LICENSE|https://github.com/${{ github.repository }}/blob/main/LICENSE|g' wiki/Home.md
          sed -i 's|\./\.env\.example|https://github.com/${{ github.repository }}/blob/main/.env.example|g' wiki/Home.md

          echo "Generating Wiki Sidebar..."
          echo "### [somnia-client](Home)" > wiki/_Sidebar.md
          echo "" >> wiki/_Sidebar.md
          echo "**Documentation**" >> wiki/_Sidebar.md
          echo "* [Home](Home)" >> wiki/_Sidebar.md
          echo "* [Quick Start](getting-started)" >> wiki/_Sidebar.md
          echo "* [Architecture](architecture)" >> wiki/_Sidebar.md
          echo "* [Configuration](configuration)" >> wiki/_Sidebar.md
          echo "* [Network & Chains](network)" >> wiki/_Sidebar.md
          echo "* [Security Best Practices](security)" >> wiki/_Sidebar.md
          echo "* [Compatibility Matrix](compatibility)" >> wiki/_Sidebar.md
          echo "* [Limitations & Boundaries](limitations)" >> wiki/_Sidebar.md
          echo "* [Feature Support Matrix](feature-support)" >> wiki/_Sidebar.md
          echo "" >> wiki/_Sidebar.md
          echo "---" >> wiki/_Sidebar.md
          echo "**Links**" >> wiki/_Sidebar.md
          echo "* [GitHub Repository](https://github.com/${{ github.repository }})" >> wiki/_Sidebar.md
          echo "* [Issue Tracker](https://github.com/${{ github.repository }}/issues)" >> wiki/_Sidebar.md
          echo "* [npm Package](https://www.npmjs.com/package/somnia-client)" >> wiki/_Sidebar.md

          echo "Generating Wiki Footer..."
          echo "---" > wiki/_Footer.md
          echo "*somnia-client — Discord-first client and abstraction layer for Somnia blockchain development.*" >> wiki/_Footer.md
          echo "[GitHub Repository](https://github.com/${{ github.repository }}) · [MIT License](https://github.com/${{ github.repository }}/blob/main/LICENSE)" >> wiki/_Footer.md

          cd wiki
          git add -A
          if git diff --staged --quiet; then
            echo "No changes detected. Wiki is already up-to-date."
          else
            git commit -m "docs: auto-sync documentation from docs/ folder"
            git push origin HEAD
            echo "Wiki successfully synchronized!"
          fi
